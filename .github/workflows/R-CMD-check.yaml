# Cross-platform R CMD check on macOS, Windows and Ubuntu.
# Generated from the standard r-lib/actions "check-standard" example.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # The "checking compiled code" check resolves R's API symbol list. If
      # tools:::nonAPI is a lazy promise rather than a baked-in vector, forcing
      # it runs tools:::ccE, which hardcodes the compiler name "cc" and aborts
      # when no such binary is on PATH. Rtools ships gcc, not cc. Record both
      # facts so a NOTE from that path is diagnosable from the log alone.
      - name: Report BLAS and cc availability
        shell: Rscript {0}
        run: |
          ns <- asNamespace("tools")
          cat("R          :", R.version.string, "\n")
          cat("BLAS       :", sessionInfo()$BLAS, "\n")
          cat("which cc   :", sQuote(Sys.which("cc")), "\n")
          cat("which gcc  :", sQuote(Sys.which("gcc")), "\n")
          cat("nonAPI     :", class(ns$nonAPI), "length", length(ns$nonAPI), "\n")

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # CRAN runs extra "Additional issues" checks against alternative BLAS
  # implementations. Version 0.0.2 passed every regular flavor and failed only
  # there, which is what got the package archived. The default R builds used
  # above all link the reference BLAS, so they cannot reproduce it. This job
  # swaps in OpenBLAS so that class of failure surfaces here instead of on CRAN.
  R-CMD-check-openblas:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, OpenBLAS)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Link R against OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev
          sudo ln -sf "$(ls /usr/lib/x86_64-linux-gnu/openblas*/libopenblas.so.0 | head -n1)" \
            "$(Rscript -e 'cat(R.home("lib"))')/libRblas.so"

      - name: Confirm the swap took effect
        run: Rscript -e 'cat(sessionInfo()$BLAS, "\n")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
